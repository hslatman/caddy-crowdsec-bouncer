name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      matrix:
        go-version: [1.25.x]
        full-tests: [false]
        include:
          - go-version: 1.25.x
            full-tests: true

    runs-on: ubuntu-latest

    steps:
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.7' # TODO: fix matrix
          cache: true

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Linting
        if: matrix.full-tests
        run: |
          curl -sL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh |
              sh -s -- -b $HOME/go/bin v2.9.0
          $HOME/go/bin/golangci-lint run --timeout=5m \
                                         --max-issues-per-linter 0 \
                                         --max-same-issues 0 \
                                         ./...

      - name: Testing
        continue-on-error: ${{ matrix.go-version == 'tip' }}
        run: |
          go version
          export GORACE="halt_on_error=1"
          go test -v -race ./...

  # End-to-end tests run Caddy in-process against real CrowdSec containers. They
  # are a separate job so that container provisioning (minutes, for the AppSec
  # collections) never delays lint and unit feedback.
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.7'
          cache: true

      - name: Checkout code
        uses: actions/checkout@v3

      - name: End-to-end testing
        run: |
          go version
          export GORACE="halt_on_error=1"
          go test -v -race -tags=e2e -timeout=25m ./test/e2e/...
