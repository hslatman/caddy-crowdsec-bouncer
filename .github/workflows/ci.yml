name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      matrix:
        go-version: [1.26.x]
        full-tests: [false]
        include:
          - go-version: 1.26.x
            full-tests: true

    runs-on: ubuntu-latest

    steps:
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26' # TODO: fix matrix
          cache: true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linting
        if: matrix.full-tests
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15

      - name: Testing
        continue-on-error: ${{ matrix.go-version == 'tip' }}
        run: |
          go version
          export GORACE="halt_on_error=1"
          go test -v -race ./...

  # End-to-end tests run Caddy in-process against real CrowdSec containers. They
  # are a separate job so that container provisioning (minutes, for the AppSec
  # collections) never delays lint and unit feedback.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: End-to-end testing
        run: |
          go version
          export GORACE="halt_on_error=1"
          go test -v -race -tags=e2e -timeout=25m ./test/e2e/...
